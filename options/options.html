<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - Pixel Color Picker</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="pixel-header">
      <div class="brand-mark">P</div>
      <div>
        <span class="eyebrow">PIXEL SETTINGS</span>
        <h1>像素吸色器设置</h1>
      </div>
    </header>

    <main class="settings-layout">
      <nav class="settings-nav" aria-label="设置分组">
        <a href="#behavior">行为</a>
        <a href="#theme">主题</a>
        <a href="#language">语言</a>
        <a href="#data">数据</a>
        <a href="#about">关于</a>
      </nav>

      <section class="settings-panel" id="behavior">
        <div class="section-head">
          <span>01</span>
          <h2>行为设置</h2>
        </div>

        <label class="setting-item">
          <span>
            <strong>默认复制格式</strong>
            <small>色块和历史复制时使用</small>
          </span>
          <select id="defaultFormat">
            <option value="hex">HEX</option>
            <option value="rgb">RGB</option>
            <option value="hsl">HSL</option>
          </select>
        </label>

        <label class="setting-item">
          <span>
            <strong>取色后动作</strong>
            <small>吸到颜色后的默认行为</small>
          </span>
          <select id="pickAction">
            <option value="save">保存</option>
            <option value="preview">预览</option>
            <option value="copy">复制</option>
            <option value="copy-save">复制并保存</option>
          </select>
        </label>

        <label class="setting-item compact">
          <span>
            <strong>自动保存</strong>
            <small>开启后取色会直接加入当前色卡</small>
          </span>
          <input type="checkbox" id="autoSave">
        </label>

        <label class="setting-item">
          <span>
            <strong>每组上限</strong>
            <small>单个色卡最多保存多少个颜色</small>
          </span>
          <input type="number" id="maxColors" min="1" max="100" value="20">
        </label>
      </section>

      <section class="settings-panel theme-panel" id="theme">
        <div class="section-head">
          <span>02</span>
          <h2>主题外观</h2>
        </div>

        <div class="theme-block theme-preset-block">
          <label class="setting-item">
            <span>
              <strong>主题预设</strong>
              <small>选择后自动填入颜色</small>
            </span>
            <select id="themePreset">
              <option value="pink">莓果像素</option>
              <option value="green">森绿软糖</option>
              <option value="night">月夜霓虹</option>
              <option value="purple">薰衣草云</option>
              <option value="cream">奶油布丁</option>
              <option value="sea">海盐气泡</option>
              <option value="cherry">樱桃软糖</option>
              <option value="gameboy">绿屏掌机</option>
              <option value="cocoa">焦糖可可</option>
              <option value="mintshake">薄荷奶昔</option>
              <option value="grape">葡萄汽水</option>
              <option value="mist">雾粉灰调</option>
              <option value="custom">自定义</option>
            </select>
          </label>
        </div>

        <div class="theme-block theme-custom-block">
          <div class="theme-block-head">
            <strong>自定义颜色</strong>
            <small>可手动选择，也可用取色记录填入</small>
          </div>

          <div class="theme-colors">
          <label class="color-item">
            <span>标题色</span>
            <input type="color" id="headerColor" value="#ff6b9d">
            <code id="headerColorValue">#FF6B9D</code>
            <button type="button" class="use-picked-btn" data-target-color="headerColor" title="用取色填入" aria-label="用取色填入标题色"></button>
          </label>
          <label class="color-item">
            <span>按钮色</span>
            <input type="color" id="buttonColor" value="#ff6b9d">
            <code id="buttonColorValue">#FF6B9D</code>
            <button type="button" class="use-picked-btn" data-target-color="buttonColor" title="用取色填入" aria-label="用取色填入按钮色"></button>
          </label>
          <label class="color-item">
            <span>背景色</span>
            <input type="color" id="bgColor" value="#fff9fc">
            <code id="bgColorValue">#FFF9FC</code>
            <button type="button" class="use-picked-btn" data-target-color="bgColor" title="用取色填入" aria-label="用取色填入背景色"></button>
          </label>
          <label class="color-item">
            <span>面板色</span>
            <input type="color" id="panelColor" value="#ffffff">
            <code id="panelColorValue">#FFFFFF</code>
            <button type="button" class="use-picked-btn" data-target-color="panelColor" title="用取色填入" aria-label="用取色填入面板色"></button>
          </label>
          </div>

          <div class="picked-target-panel" id="pickedTargetPanel" hidden>
            <div class="picked-target-head">
              <strong id="pickedTargetTitle">选择颜色</strong>
              <button type="button" id="closePickedTarget">×</button>
            </div>
            <div class="picked-theme-list" id="targetColorHistory">
              <span class="picked-empty">还没有取色历史</span>
            </div>
          </div>
        </div>

        <div class="theme-block theme-picked-block">
          <div class="picked-theme-panel">
            <div class="picked-theme-head">
              <strong>用取色生成主题</strong>
              <button type="button" id="useLastPicked">使用最近取色</button>
            </div>
            <div class="picked-theme-list" id="themeColorHistory">
              <span class="picked-empty">还没有取色历史</span>
            </div>
          </div>
        </div>

        <div class="theme-block theme-preview-block">
          <div class="theme-block-head">
            <strong>实时预览</strong>
            <small>保存后同步到 popup</small>
          </div>

          <div class="theme-preview" id="themePreview">
            <div class="preview-window">
              <div class="preview-head" id="previewHead">
                <span>PIXEL TOOL</span>
                <button type="button" id="previewButton">按钮</button>
              </div>
              <div class="preview-body" id="previewBody">
                <span class="preview-swatch"></span>
                <div>
                  <strong>默认色卡</strong>
                  <small>主题会同步到 popup</small>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="settings-panel" id="language">
        <div class="section-head">
          <span>03</span>
          <h2>语言设置</h2>
        </div>

        <label class="setting-item">
          <span>
            <strong>界面语言</strong>
            <small>后续会同步到 popup 和设置页</small>
          </span>
          <select id="languageSelect">
            <option value="zh-CN">简体中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </section>

      <section class="settings-panel" id="data">
        <div class="section-head">
          <span>04</span>
          <h2>数据管理</h2>
        </div>
        <div class="button-stack">
          <button class="pixel-button" id="exportData">导出全部数据</button>
          <button class="pixel-button mint" id="importData">导入数据</button>
          <button class="pixel-button danger" id="clearData">清空全部数据</button>
        </div>
      </section>

      <section class="settings-panel" id="about">
        <div class="section-head">
          <span>05</span>
          <h2>关于</h2>
        </div>
        <div class="about-info">
          <p>Pixel Color Picker v1.0.0</p>
          <p>小巧可爱的像素风网页吸色工具</p>
          <p>© 2026 Pixel Color Picker</p>
        </div>
        <button class="pixel-button secondary" id="viewHistory">查看更新日志</button>
      </section>
    </main>

    <footer class="pixel-footer">
      <button id="saveSettings" class="pixel-button primary">保存设置</button>
      <button id="resetSettings" class="pixel-button light">重置</button>
      <button id="backToPopup" class="pixel-button light">关闭</button>
    </footer>
  </div>

  <script src="../shared/i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
