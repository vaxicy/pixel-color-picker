<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Completing Payment</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff9fc;
      color: #332d36;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    main {
      width: min(640px, 100%);
      padding: 24px;
      border: 3px solid #332d36;
      background: white;
      box-shadow: 8px 8px 0 rgba(51, 45, 54, 0.16);
    }

    h1 {
      margin: 0 0 12px;
    }

    p {
      line-height: 1.6;
    }

    .hint {
      margin-top: 14px;
      color: #6f6570;
      font-size: 15px;
    }

    code {
      display: block;
      padding: 12px;
      border: 2px solid #332d36;
      background: #fff0a8;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Completing payment...</h1>
    <p id="message">Please keep this page open while PayPal confirms your order.</p>
    <code id="license" hidden></code>
    <p class="hint" id="hint" hidden></p>
  </main>

  <script>
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const license = document.getElementById('license');
    const hint = document.getElementById('hint');
    const token = new URLSearchParams(window.location.search).get('token');

    const fail = (text) => {
      title.textContent = 'Payment needs attention';
      message.textContent = text;
    };

    const complete = async () => {
      if (!token) {
        fail('PayPal did not return an order token.');
        return;
      }

      try {
        const response = await fetch('/api/paypal/capture-order', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ orderID: token })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unable to capture the order');

        title.textContent = 'Pro license created';
        message.textContent = data.emailSent
          ? `We sent your license to ${data.email}. You can also copy it here:`
          : `License created for ${data.email}, but email was not sent: ${data.emailError || 'unknown email error'}. Copy and save it here:`;
        license.hidden = false;
        license.textContent = data.licenseKey;
        hint.hidden = false;
        hint.textContent = data.emailSent
          ? 'If the email is not in your inbox, please check your Spam or Junk folder. Copy and save this license key before closing this page.'
          : 'Copy and save this license key before closing this page.';
      } catch (error) {
        fail(error.message);
      }
    };

    complete();
  </script>
</body>
</html>
