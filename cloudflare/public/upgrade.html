<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Color Picker Pro</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #332d36;
      --soft: #6f6570;
      --line: #332d36;
      --pink: #ff6b9d;
      --mint: #69d9bf;
      --cream: #fff0a8;
      --paper: #fff9fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(rgba(63, 52, 64, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(63, 52, 64, 0.055) 1px, transparent 1px),
        var(--paper);
      background-size: 24px 24px;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    main {
      width: min(720px, 100%);
      border: 3px solid var(--line);
      background: white;
      box-shadow: 8px 8px 0 rgba(51, 45, 54, 0.16);
    }

    header {
      padding: 24px;
      border-bottom: 3px solid var(--line);
      background: var(--pink);
      color: white;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.15;
    }

    header p {
      margin: 0;
      max-width: 56ch;
    }

    section {
      padding: 24px;
    }

    ul {
      margin: 16px 0 0;
      padding-left: 20px;
      color: var(--soft);
      line-height: 1.7;
    }

    .checkout {
      display: grid;
      gap: 14px;
      margin-top: 22px;
      padding: 18px;
      border: 2px solid var(--line);
      background: #fffdf6;
    }

    label {
      display: grid;
      gap: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--line);
      font: inherit;
    }

    button {
      min-height: 44px;
      border: 2px solid var(--line);
      background: var(--mint);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 3px 3px 0 rgba(51, 45, 54, 0.18);
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .status {
      min-height: 20px;
      color: var(--soft);
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Pixel Color Picker Pro</h1>
      <p>Unlock unlimited palettes, Pro themes, custom themes, and future advanced tools.</p>
    </header>

    <section>
      <strong>Lifetime Pro</strong>
      <ul>
        <li>One-time payment</li>
        <li>License key delivered by email after payment</li>
        <li>Activate inside the extension settings</li>
      </ul>

      <div class="checkout">
        <label>
          Email for your license
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
        </label>
        <button id="buy">Buy Pro with PayPal</button>
        <div class="status" id="status"></div>
      </div>
    </section>
  </main>

  <script>
    const statusNode = document.getElementById('status');
    const buyButton = document.getElementById('buy');
    const emailInput = document.getElementById('email');

    const setStatus = (message) => {
      statusNode.textContent = message;
    };

    buyButton.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email || !email.includes('@')) {
        setStatus('Enter the email address that should receive the license.');
        return;
      }

      buyButton.disabled = true;
      setStatus('Creating PayPal order...');

      try {
        const response = await fetch('/api/paypal/create-order', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unable to create order');

        const approvalUrl = data.approvalUrl || '';
        if (!approvalUrl) {
          const rels = Array.isArray(data.linkRels) && data.linkRels.length
            ? ` Returned links: ${data.linkRels.join(', ')}`
            : '';
          throw new Error(`PayPal approval link missing.${rels}`);
        }
        window.location.href = approvalUrl;
      } catch (error) {
        setStatus(error.message);
        buyButton.disabled = false;
      }
    });
  </script>
</body>
</html>
